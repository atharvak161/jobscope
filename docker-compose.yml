services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobscope
      POSTGRES_USER: jobscope
      POSTGRES_PASSWORD: jobscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://jobscope:jobscope@db:5432/jobscope
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_API_KEY: ${ADZUNA_API_KEY}
      REED_API_KEY: ${REED_API_KEY}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      INGEST_SECRET: ${INGEST_SECRET:-change-me}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npm start"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build: .
    command: sh -c "while true; do wget -q -O- --post-data='' --header='x-ingest-token:${INGEST_SECRET:-change-me}' http://app:3000/api/ingest || true; sleep 21600; done"
    environment:
      - INGEST_SECRET=${INGEST_SECRET:-change-me}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
